# Stack de produção, baixada pelo `guildos-deploy` no servidor a cada deploy.
# O Traefik do servidor (rede externa `edge`) termina TLS para tiiv.com.br e *.tiiv.com.br.
# Variáveis em /opt/guildos/.env (geradas no servidor, nunca no repositório).
name: guildos

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guildos}
      POSTGRES_USER: ${POSTGRES_USER:-guildos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # Garante o banco do app (APP_DB) no cluster. Idempotente e não destrutivo: o banco
  # antigo (POSTGRES_DB, de antes da reescrita do core) fica intocado.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-guildos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-guildos}
      APP_DB: ${APP_DB:-guildos_core}
    command:
      - sh
      - -c
      - >-
        psql -Atc "SELECT 1 FROM pg_database WHERE datname = '$${APP_DB}'" | grep -q 1
        || createdb "$${APP_DB}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    image: ghcr.io/brunoavila55/guildos-api:${IMAGE_TAG:?defina IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-guildos}:${POSTGRES_PASSWORD}@postgres:5432/${APP_DB:-guildos_core}
      API_BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-api=info,tower_http=info}
      BASE_DOMAIN: tiiv.com.br
      COOKIE_SECURE: "true"
      SUPERADMIN_EMAILS: ${SUPERADMIN_EMAILS:-}
      STORAGE: local
    volumes:
      - media:/var/lib/guildos/media
    depends_on:
      db-init:
        condition: service_completed_successfully
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - "traefik.http.routers.guildos-api.rule=HostRegexp(`^([a-z0-9-]+\\.)?tiiv\\.com\\.br$$`) && PathPrefix(`/api`)"
      - traefik.http.routers.guildos-api.entrypoints=websecure
      - traefik.http.routers.guildos-api.priority=20
      - traefik.http.services.guildos-api.loadbalancer.server.port=8080
    networks:
      - internal
      - edge

  web:
    image: ghcr.io/brunoavila55/guildos-web:${IMAGE_TAG:?defina IMAGE_TAG}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - "traefik.http.routers.guildos-web.rule=HostRegexp(`^([a-z0-9-]+\\.)?tiiv\\.com\\.br$$`)"
      - traefik.http.routers.guildos-web.entrypoints=websecure
      - traefik.http.routers.guildos-web.priority=10
      - traefik.http.services.guildos-web.loadbalancer.server.port=80
    networks:
      - edge

volumes:
  pgdata:
  media:

networks:
  internal:
  edge:
    external: true
