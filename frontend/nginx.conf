# Mesmo bundle para todo host (landing, app., admin., {slug}.): o app decide pelo hostname.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
